<!DOCTYPE html>
<html>
<head>
    <title>Nano Banana Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }
        textarea {
            width: 80%;
            max-width: 500px;
            height: 100px;
            font-size: 16px;
        }
        button {
            font-size: 16px;
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
        #imageContainer img {
            margin-top: 20px;
            max-width: 90%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        #loadingSpinner {
            display: none;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Nano Banana Image Generator</h1>
    <textarea id="description" placeholder="Enter your image description here..."></textarea><br>
    <button id="generateBtn">Generate Image</button>
    <div id="loadingSpinner">🌀 Generating image...</div>
    <div id="imageContainer"></div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const generateBtn = document.getElementById('generateBtn');
        const descriptionInput = document.getElementById('description');
        const imageContainer = document.getElementById('imageContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');

        generateBtn.addEventListener('click', () => {
            const prompt = descriptionInput.value.trim();
            if (!prompt) {
                alert('Please enter a description.');
                return;
            }

            // Clear previous image and show spinner
            imageContainer.innerHTML = '';
            loadingSpinner.style.display = 'block';

            // Generate the image
            puter.ai.txt2img(prompt, false)
                .then((image) => {
                    loadingSpinner.style.display = 'none';
                    imageContainer.appendChild(image);
                })
                .catch((err) => {
                    loadingSpinner.style.display = 'none';
                    console.error(err);
                    alert('Error generating image.');
                });
        });
    </script>
</body>
</html>
