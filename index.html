<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puter.js txt2img Generator (with URL → Base64)</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      padding: 2em;
      color: #333;
    }
    form {
      background: #fff;
      padding: 1.5em;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
      margin-bottom: 2em;
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: 600;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.25em;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }
    button {
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1.5em;
    }
    button:hover {
      background: #0056b3;
    }
    #output img {
      max-width: 100%;
      display: block;
      margin-top: 1em;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Puter.js txt2img Generator</h1>
  <form id="txt2imgForm">
    <label>Prompt</label>
    <textarea id="prompt" rows="2">A cute cat playing piano</textarea>

    <label>Test Mode</label>
    <select id="testMode">
      <option value="false" selected>false</option>
      <option value="true">true</option>
    </select>

    <label>Model</label>
    <select id="model">
      <option value="gpt-image-1-mini" selected>gpt-image-1-mini (default)</option>
      <option value="gpt-image-1">gpt-image-1</option>
      <option value="dall-e-3">dall-e-3</option>
      <option value="gemini-2.5-flash-image-preview">gemini-2.5-flash-image-preview</option>
    </select>

    <label>Quality</label>
    <select id="quality">
      <option value="low" selected>low (default)</option>
      <option value="medium">medium</option>
      <option value="high">high</option>
      <option value="standard">standard (for DALL-E 3)</option>
      <option value="hd">hd (for DALL-E 3)</option>
    </select>

    <label>Input Image URL (for Gemini image-to-image only)</label>
    <input type="url" id="input_image_url" placeholder="https://example.com/image.png" />

    <label>Input Image MIME Type</label>
    <select id="input_image_mime_type">
      <option value="">(auto-detect)</option>
      <option value="image/png" selected>image/png</option>
      <option value="image/jpeg">image/jpeg</option>
      <option value="image/jpg">image/jpg</option>
      <option value="image/webp">image/webp</option>
    </select>

    <button type="submit">Generate Image</button>
  </form>

  <div id="output"></div>

  <script>
    const form = document.getElementById('txt2imgForm');
    const output = document.getElementById('output');

    // Helper: fetch an image URL and convert to Base64
    async function imageUrlToBase64(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Failed to fetch image from URL");
      const blob = await response.blob();

      // Auto-detect MIME type if not explicitly provided
      const mimeType = blob.type || "image/png";

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve({ base64: reader.result.split(",")[1], mimeType });
        reader.readAsDataURL(blob);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      output.innerHTML = "<p>Generating image... please wait.</p>";

      const prompt = document.getElementById('prompt').value;
      const testMode = document.getElementById('testMode').value === 'true';
      const model = document.getElementById('model').value;
      const quality = document.getElementById('quality').value;
      const imageUrl = document.getElementById('input_image_url').value.trim();
      const userMime = document.getElementById('input_image_mime_type').value;

      const options = { model, quality };

      try {
        // If user provided an image URL, convert it to base64
        if (imageUrl && model === "gemini-2.5-flash-image-preview") {
          const { base64, mimeType } = await imageUrlToBase64(imageUrl);
          //console.log(base64)
          options.input_image = base64;
          options.input_image_mime_type = userMime || mimeType;
        }

        // Call puter.ai.txt2img()
        const image = await puter.ai.txt2img(prompt, testMode ? true : options);

        // if (typeof image === "string") {
        //   const img = document.createElement("img");
        //   img.src = image;
          output.innerHTML = "";
          output.appendChild(image);
        // } else {
        //   output.innerHTML = "<p>Unexpected output. Check console.</p>";
        //   console.log(image);
        // }
      } catch (err) {
        output.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
        console.error(err);
      }
    });
  </script>

</body>
</html>
